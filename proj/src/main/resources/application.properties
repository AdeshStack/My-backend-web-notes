# --- MySQL connection ---
# Reads from environment variables when deployed (e.g. Railway/Render inject these);
# falls back to a local MySQL instance for development.
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/dsa_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update creates/updates the question_progress table automatically on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Server ---
# Deployment platforms (Railway, Render, etc.) inject PORT; default to 8080 locally.
server.port=8094
