<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misc — My Own Questions</title>
<style>
:root{--bg:#f7fafc;--card:#ffffff;--text:#10233f;--muted:#607089;--line:#dbe8f5;--accent:#7657ff;--amber:#ffb703;--shadow:0 10px 30px rgba(118,87,255,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
</style>
<style>
.gtabs{position:sticky;top:0;z-index:999;display:flex;gap:2px;background:#0f1420;padding:6px 10px;overflow-x:auto;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.gtabs a{color:#aab4c5;text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;flex:0 0 auto}
.gtabs a:hover{background:#1c2333;color:#fff}
.gtabs a.active{background:#2f6fed;color:#fff}
</style>
<style>
header{position:sticky;top:38px;z-index:10;background:#ffffff;border-bottom:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(16,35,63,.04)}
.wrap{max-width:1100px;margin:auto;padding:18px}
h1{margin:0;font-size:24px}.sub{color:var(--muted);margin:5px 0 16px;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:linear-gradient(145deg,#fff,#faf9ff);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
select,input[type=search],button.clear{border:1px solid #cfe0ef;background:#fff;border-radius:10px;padding:10px 12px;color:var(--text)}
main{max-width:1100px;margin:auto;padding:18px}

.add-form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:20px}
.add-form h2{margin:0 0 12px;font-size:16px}
.add-form input[type=text], .add-form textarea{width:100%;border:1px solid #cfe0ef;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;margin-bottom:10px}
.add-form textarea{min-height:90px;resize:vertical}
.add-form button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13.5px}
.add-form button:hover{opacity:.9}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:linear-gradient(145deg,#fff,#fbfaff);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);position:relative}
.card.reviewed{border-color:#c9b8ff;background:linear-gradient(180deg,#fff,#f8f5ff)}
.cardtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.star-flag{border:0;background:none;font-size:19px;color:#d7dce6;cursor:pointer;padding:0;line-height:1}
.star-flag.active{color:var(--amber)}
h3{font-size:15px;line-height:1.4;margin:10px 0}
.toggle-ans{border:1px solid #e0d6ff;background:#f7f4ff;color:#5a3fd6;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-right:6px}
.answer{margin-top:10px;font-size:13.5px;line-height:1.55;color:#2b3a52;background:#f8f7ff;border:1px solid #ece6ff;border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.rating{display:flex;align-items:center;gap:3px;margin-top:10px;font-size:12px;color:var(--muted)}
.rating button{border:0;background:none;color:#cbd1dd;font-size:18px;padding:0;cursor:pointer}
.rating button.active{color:var(--amber)}
.ratingText{margin-left:5px}
.card-btns{display:flex;gap:6px;margin-top:12px}
.card-btns button{border:1px solid #e0d6ff;background:#fff;color:#5a3fd6;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600}
.card-btns button.danger{border-color:#f6c9c4;color:#c0392b}
.edit-form input, .edit-form textarea{width:100%;border:1px solid #cfe0ef;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px;margin-bottom:8px}
.edit-form textarea{min-height:80px}
.empty{text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body>
<nav class="gtabs" id="globalTabs">
<a href="/" data-path="/">Home</a>
<a href="/dsa" data-path="/dsa">DSA</a>
<a href="/dbms" data-path="/dbms">DBMS</a>
<a href="/azure" data-path="/azure">Azure</a>
<a href="/java" data-path="/java">Java</a>
<a href="/docker" data-path="/docker">Docker / CI-CD</a>
<a href="/misc" data-path="/misc">Misc</a>
</nav>
<script>
(function(){
  var here = window.location.pathname.replace(/\/$/, "") || "/";
  document.querySelectorAll("#globalTabs a").forEach(function(a){
    var p = a.getAttribute("data-path");
    if (p === here || (p !== "/" && here.indexOf(p) === 0)) a.classList.add("active");
  });
})();
</script>

<img src="/img/banner.png" alt="Code and Cricket Jams banner" style="display:block;width:100%;max-height:220px;object-fit:cover;">


<header><div class="wrap">
<h1>📝 Misc — My Own Questions</h1>
<div class="sub">Add any question + your own answer &bull; saved automatically to MySQL</div>
<div class="stats">
<div class="stat"><b id="total">0</b><span>Total questions</span></div>
<div class="stat"><b id="reviewedCount">0</b><span>Reviewed</span></div>
<div class="stat"><b id="importantCount">0</b><span>Marked important</span></div>
<div class="stat"><b id="percent">0%</b><span>Reviewed %</span></div>
</div>
<div class="controls">
<select id="status"><option value="">All status</option><option value="reviewed">Reviewed</option><option value="unreviewed">Not reviewed</option><option value="important">Important</option></select>
<input id="search" type="search" placeholder="Search question or answer...">
</div>
</div></header>

<main>
<div class="add-form">
<h2>Add a new question</h2>
<input id="newTitle" type="text" placeholder="Question title...">
<textarea id="newAnswer" placeholder="Your answer..."></textarea>
<button id="addBtn">Add Question</button>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>No questions match your filters, or you haven't added any yet.</div>
</main>

<script>
let items = [];
let editingId = null;
let expandedIds = new Set();

async function loadItems() {
  const res = await fetch("/api/misc");
  items = await res.json();
  render();
}

async function createItem() {
  const title = document.getElementById("newTitle").value.trim();
  const answer = document.getElementById("newAnswer").value.trim();
  if (!title) { alert("Please enter a question title."); return; }
  await fetch("/api/misc", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, answer })
  });
  document.getElementById("newTitle").value = "";
  document.getElementById("newAnswer").value = "";
  await loadItems();
}

async function updateItem(id, patch) {
  await fetch("/api/misc/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(patch)
  });
  await loadItems();
}

async function deleteItem(id) {
  if (!confirm("Delete this question permanently?")) return;
  await fetch("/api/misc/" + id, { method: "DELETE" });
  await loadItems();
}

function esc(str) {
  return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function updateStats(filtered) {
  const total = items.length;
  const reviewed = items.filter(x => x.done === 1).length;
  const important = items.filter(x => x.flagged === 1).length;
  const pct = total ? Math.round(reviewed / total * 100) : 0;
  document.getElementById("total").textContent = total;
  document.getElementById("reviewedCount").textContent = reviewed;
  document.getElementById("importantCount").textContent = important;
  document.getElementById("percent").textContent = pct + "%";
}

function render() {
  const grid = document.getElementById("grid");
  const st = document.getElementById("status").value;
  const q = document.getElementById("search").value.toLowerCase();

  const filtered = items.filter(item => {
    const matchesSearch = !q || (item.title + " " + (item.answer||"")).toLowerCase().includes(q);
    const matchesStatus = !st ||
      (st === "reviewed" && item.done === 1) ||
      (st === "unreviewed" && item.done !== 1) ||
      (st === "important" && item.flagged === 1);
    return matchesSearch && matchesStatus;
  });

  updateStats(filtered);
  document.getElementById("empty").hidden = filtered.length !== 0;

  grid.innerHTML = filtered.map(item => {
    const isOpen = expandedIds.has(item.id);
    const isEditing = editingId === item.id;
    const rating = item.rating || 0;

    if (isEditing) {
      return `
      <article class="card" data-id="${item.id}">
        <div class="edit-form">
          <input type="text" class="edit-title" value="${esc(item.title)}">
          <textarea class="edit-answer">${esc(item.answer)}</textarea>
          <div class="card-btns">
            <button class="save-edit">Save</button>
            <button class="cancel-edit">Cancel</button>
          </div>
        </div>
      </article>`;
    }

    return `
    <article class="card ${item.done === 1 ? "reviewed" : ""}" data-id="${item.id}">
      <div class="cardtop">
        <label><input type="checkbox" class="reviewed" ${item.done === 1 ? "checked" : ""}> Reviewed</label>
        <button class="star-flag ${item.flagged === 1 ? "active" : ""}" title="Mark important">&#9733;</button>
      </div>
      <h3>${esc(item.title)}</h3>
      <button class="toggle-ans">${isOpen ? "Hide Answer &#9650;" : "Show Answer &#9660;"}</button>
      <div class="answer" ${isOpen ? "" : "hidden"}>${esc(item.answer) || "(no answer written yet)"}</div>
      <div class="rating">
        <span>My rating:</span>
        ${[1,2,3,4,5].map(i => `<button data-rate="${i}" class="${i <= rating ? "active" : ""}">&#9733;</button>`).join("")}
        <span class="ratingText">${rating ? rating + "/5" : "Not rated"}</span>
      </div>
      <div class="card-btns">
        <button class="edit-btn">Edit</button>
        <button class="danger delete-btn">Delete</button>
      </div>
    </article>`;
  }).join("");

  [...grid.querySelectorAll(".card")].forEach(card => {
    const id = Number(card.dataset.id);
    const item = items.find(x => x.id === id);

    if (editingId === id) {
      card.querySelector(".save-edit").addEventListener("click", async () => {
        const title = card.querySelector(".edit-title").value.trim();
        const answer = card.querySelector(".edit-answer").value.trim();
        if (!title) { alert("Title can't be empty."); return; }
        editingId = null;
        await updateItem(id, { title, answer });
      });
      card.querySelector(".cancel-edit").addEventListener("click", () => { editingId = null; render(); });
      return;
    }

    card.querySelector(".toggle-ans").addEventListener("click", () => {
      if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
      render();
    });
    card.querySelector(".reviewed").addEventListener("change", e => {
      updateItem(id, { done: e.target.checked ? 1 : 0, flagged: item.flagged, rating: item.rating });
    });
    card.querySelector(".star-flag").addEventListener("click", () => {
      updateItem(id, { done: item.done, flagged: item.flagged === 1 ? 0 : 1, rating: item.rating });
    });
    card.querySelectorAll("[data-rate]").forEach(b => {
      b.addEventListener("click", () => {
        updateItem(id, { done: item.done, flagged: item.flagged, rating: Number(b.dataset.rate) });
      });
    });
    card.querySelector(".edit-btn").addEventListener("click", () => { editingId = id; render(); });
    card.querySelector(".delete-btn").addEventListener("click", () => deleteItem(id));
  });
}

document.getElementById("addBtn").addEventListener("click", createItem);
["status","search"].forEach(id => document.getElementById(id).addEventListener("input", render));

loadItems();
</script>
</body>
</html>
